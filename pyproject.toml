[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rka-app"
version = "0.0.1"
description = "Installer and lifecycle supervisor for RKA Core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RKA Project"}]
dependencies = []

[project.scripts]
rka-app = "rka_app.supervisor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
