name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install RKA App
        run: python -m pip install --no-deps .
      - name: Run supervisor unit tests
        run: python -m unittest discover -s tests -v

  dockerfile-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm an immutable Core reference is mandatory
        shell: bash
        run: |
          if docker build . 2>build-error.log; then
            echo "Dockerfile unexpectedly accepted a missing Core image reference"
            exit 1
          fi
          grep -Eq "base name.*empty|RKA_CORE_IMAGE|invalid reference" build-error.log
